[project]
name = "shmample"
version = "0.1.0"
description = "Browse, tag, and preview samples in the terminal"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "textual-plotext>=1.0",
    "soundfile>=0.13",
    "soxr>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
shmample = "shmample.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shmample"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
